<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-label="WADAN coin landscape">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151a"/>
      <stop offset=".38" stop-color="#241a18"/>
      <stop offset=".68" stop-color="#130e10"/>
      <stop offset="1" stop-color="#05080b"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".68" cy=".18" r=".62">
      <stop offset="0" stop-color="#f7b46f" stop-opacity=".75"/>
